+ClassRedirects=(OldName="/Script/BullyRemake.BullyPawn",NewName="/Script/BullyRemake.BullyCharacter")

[/Script/NavigationSystem.RecastNavMesh]
; sm-humandrive: runtime-generated navmesh, used only by the human-mode mission smoke (-BRMissionSmokeHuman), which spawns its
; own NavMeshBoundsVolumes around the mission's points. With no bounds volume in the level (every other run) nothing is built.
RuntimeGeneration=Dynamic
AgentMaxStepHeight=45.0
; the per-resolution params override the flat AgentMaxStepHeight in UE 5.x; finer cells so 25 cm stair risers with 30 cm
; treads (the academy front stairs) voxelize as steps instead of an unwalkable ledge
NavMeshResolutionParams[0]=(CellSize=19.000000,CellHeight=5.f,AgentMaxStepHeight=45.f)
NavMeshResolutionParams[1]=(CellSize=10.000000,CellHeight=5.f,AgentMaxStepHeight=45.f)
NavMeshResolutionParams[2]=(CellSize=10.000000,CellHeight=5.f,AgentMaxStepHeight=45.f)
